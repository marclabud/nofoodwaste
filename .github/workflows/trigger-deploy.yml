name: Trigger Deployment

on:
  push:
    branches:
      - main

jobs:
  trigger-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Private Infra Workflow
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_TRIGGER_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/marclabud/nofoodwaste-infra/dispatches \
            -d '{"event_type": "trigger-deploy"}'
