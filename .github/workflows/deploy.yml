name: Deploy NoFoodWaste App

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch

permissions:
  contents: read
  id-token: write # Zwingend erforderlich für Workload Identity Federation (OIDC)

env:
  PROJECT_ID: "my-first-project-9510f"
  REGION: "europe-west6"
  REPO_NAME: "nofoodwaste-repo"
  BACKEND_SERVICE: "nofoodwaste-backend"
  RUNTIME_SA: "nofoodwaste-backend-sa@my-first-project-9510f.iam.gserviceaccount.com"
  DEPLOYER_SA: "github-actions-deployer@my-first-project-9510f.iam.gserviceaccount.com"
  WIF_PROVIDER: "projects/301426404374/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================
  # JOB 1: FastAPI Backend nach Cloud Run deployen
  # ==========================================
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authentifizierung bei GCP über WIF
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      # 2. Docker Login in die Google Artifact Registry (GAR)
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 3. Docker Image bauen & in GAR pushen (Baut automatisch für linux/amd64)
      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./Apps/Backend
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 4. Deployment des neuen Images auf Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: --service-account=${{ env.RUNTIME_SA }}
          env_vars: |
            DB_PROVIDER=firestore
            ENVIRONMENT=production
            ALLOWED_ORIGINS=https://my-first-project-9510f.web.app,https://my-first-project-9510f.firebaseapp.com
          secrets: |
            GEMINI_API_KEY=gemini-api-key:latest

  # ==========================================
  # JOB 2: Nuxt Frontend nach Firebase Hosting deployen
  # ==========================================
  deploy-frontend:
    needs: deploy-backend # Wartet, bis das Backend erfolgreich deployt ist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Node.js und pnpm für den Build einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      # 2. Frontend-Abhängigkeiten installieren & statische Seite generieren
      - name: Build Frontend
        run: |
          cd Apps/Frontend
          pnpm install --no-frozen-lockfile
          # Statischer Export der Nuxt-App mit der Live-Backend-URL
          export NUXT_PUBLIC_API_BASE="https://nofoodwaste-backend-301426404374.europe-west6.run.app"
          pnpm run generate

      # 3. Deployment auf Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_FIRST_PROJECT_9510F }}"
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
          entryPoint: "./Apps/Frontend"
